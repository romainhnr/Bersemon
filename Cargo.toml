[workspace]
resolver = "3"
members = [
    "crates/bersemon-core",
    "crates/bersemon-storage",
    "crates/bersemon-console",
]

# rust-version suit le poste Windows 10 (Rust installé par MSI, sans rustup) :
# c'est la version la plus ancienne sur laquelle le projet doit compiler.
# Avec le resolver 3, cargo choisit des dépendances compatibles avec elle.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Dépendances externes, centralisées ici pour que tous les crates utilisent
# les mêmes versions. Seul le stockage en dépend : le noyau n'en a aucune.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
